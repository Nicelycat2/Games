<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Redirecting to The Sunken Fate V3...</title>
   <meta http-equiv="refresh" content="0; url=https://nicelycat.github.io/TheSunkenFateV3">
   <style>
       body {
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
           color: white;
           display: flex;
           justify-content: center;
           align-items: center;
           height: 100vh;
           margin: 0;
           text-align: center;
       }
       .container {
           background: rgba(255, 255, 255, 0.1);
           padding: 2rem;
           border-radius: 20px;
           backdrop-filter: blur(10px);
           box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
       }
       h1 {
           margin-bottom: 1rem;
           font-size: 2rem;
       }
       p {
           font-size: 1.1rem;
           opacity: 0.9;
       }
       a {
           color: #64b5f6;
           text-decoration: none;
           font-weight: bold;
       }
       a:hover {
           text-decoration: underline;
       }
       .loader {
           width: 50px;
           height: 50px;
           border: 4px solid rgba(255, 255, 255, 0.3);
           border-top: 4px solid white;
           border-radius: 50%;
           animation: spin 1s linear infinite;
           margin: 20px auto;
       }
       @keyframes spin {
           0% { transform: rotate(0deg); }
           100% { transform: rotate(360deg); }
       }
   </style>
</head>
<body>
   <div class="container">
       <div class="loader"></div>
       <h1>🌊 The Sunken Fate V3</h1>
       <p>Redirecting you to the adventure...</p>
       <p>If you are not redirected automatically, <a href="https://nicelycat.github.io/TheSunkenFateV3">click here</a>.</p>
   </div>
   
   <script>
       // JavaScript fallback redirect
       window.location.href = "https://nicelycat.github.io/TheSunkenFateV3";
   </script>
</body>
</html>
